# ============================================================
#  Fan RF Bridge -- Home Assistant config
#  1) Replace ESP_IP below with your ESP32's IP (serial "WiFi OK, IP=...").
#  2) Paste this into configuration.yaml.
#  3) Developer Tools -> YAML -> CHECK CONFIGURATION, then RESTART.
#  Creates a button.* entity per fan button (masterbedroom / patio).
# ============================================================

rest_command:
  fan_send:
    url: "http://ESP_IP/send?fan={{ fan }}&btn={{ btn | urlencode }}&n={{ n | default(1) }}"
    method: GET

template:
  - button:
      - name: "masterbedroom 1"
        unique_id: fanrc_masterbedroom_1
        press:
          - action: rest_command.fan_send
            data: { fan: masterbedroom, btn: "1" }
